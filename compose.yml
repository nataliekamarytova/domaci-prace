services:
  postgres:
    image: postgres:18
    container_name: chores-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chores
      POSTGRES_PASSWORD: chores
      POSTGRES_DB: chores
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 images store data under /var/lib/postgresql (not .../data)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chores -d chores"]
      interval: 5s
      timeout: 3s
      retries: 10
 
volumes:
  pgdata:
